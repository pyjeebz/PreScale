name: Release

on:
  push:
    tags:
      # Full versions only: the Action's moving major tag (v1) must not republish.
      - 'v*.*.*'

jobs:
  pypi:
    name: Publish CLI to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publishing, no token needed
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Stop before publishing if the changelog doesn't have this version, dated.
      - name: Check the changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Eq "^## ${version//./\\.} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md needs a dated entry: '## ${version} — YYYY-MM-DD'"
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        working-directory: cli
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cli/dist

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The release notes are this version's section of CHANGELOG.md, the one public changelog.
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## " v " ") == 1 { on = 1; next } on && /^## / { exit } on { print }' \
            CHANGELOG.md > release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

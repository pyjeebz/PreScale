<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!--
  The social card (og.png, 1200x630): a load test frozen at the moment it breaks.
  Render: open this file in a browser at exactly 1200x630, screenshot the viewport,
  and save it as landing-page/public/og.png. It loads the site's fonts from Google Fonts.
-->
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #000; --fg: #ededed; --muted: #a1a1a1; --dim: #6b6b6b; --line: #333;
    --red: #EE4B44;
    --cell: 6px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: var(--bg); overflow: hidden; }
  body { position: relative; font-family: "Google Sans", system-ui, sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }


  .top { position: absolute; left: 64px; right: 64px; top: 52px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
  .mark { width: 34px; height: 34px; }
  .url { font-size: 16px; color: var(--muted); }

  h1 { position: absolute; left: 64px; top: 118px; font-size: 62px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 500; }
  h1 span { display: block; }
  h1 .dim { color: var(--muted); font-weight: 400; }

  /* The ramp: one row per load stage. */
  .chart { position: absolute; left: 64px; right: 64px; top: 312px; }
  .row { display: grid; grid-template-columns: 92px 1fr; align-items: center; height: 18px; margin-bottom: 21px; }
  .users { font-size: 13px; color: var(--dim); }
  .track { position: relative; height: 18px; }
  .bar { position: absolute; left: 0; top: 2px; height: 14px; display: flex; }
  .bar .s { flex: 1; min-width: 0; }
  .bar .c { width: 42px; flex: none; }
  .bar .e { width: 18px; flex: none; }
  .ms { position: absolute; top: 1px; font-size: 13px; color: var(--muted); white-space: nowrap; }

  /* The latency wall, and the bar that goes through it. */
  .wall { position: absolute; top: 300px; height: 238px; width: 1px;
          background: linear-gradient(var(--dim) 55%, transparent 0) 0 0 / 1px 7px; }
  .wall-label { position: absolute; top: 276px; font-size: 13px; color: var(--dim); transform: translateX(-50%); white-space: nowrap; }
  .glow { position: absolute; width: 420px; height: 200px; border-radius: 50%;
          background: radial-gradient(closest-side, rgb(238 75 68 / .22), transparent); filter: blur(6px); }
  .break { color: var(--red); }
  /* The why, in the CLI's voice. */
  .verdict { position: absolute; left: 64px; top: 558px; font-size: 15px; color: var(--muted); white-space: nowrap; }
  .verdict .fg { color: var(--fg); }
  .verdict .red { color: var(--red); }
  .verdict .sep { color: var(--dim); padding: 0 6px; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges"><style>.w{fill:#EDEDED}.c{fill:#3FD3DE}</style><rect x="7" y="3" width="1" height="1" class="w"/><rect x="9" y="3" width="1" height="1" class="w"/><rect x="11" y="3" width="2" height="1" class="w"/><rect x="2" y="4" width="1" height="1" class="w"/><rect x="4" y="4" width="1" height="1" class="w"/><rect x="6" y="4" width="1" height="1" class="w"/><rect x="8" y="4" width="1" height="1" class="w"/><rect x="10" y="4" width="3" height="1" class="w"/><rect x="7" y="5" width="1" height="1" class="w"/><rect x="9" y="5" width="1" height="1" class="w"/><rect x="11" y="5" width="2" height="1" class="w"/><rect x="2" y="6" width="1" height="1" class="w"/><rect x="4" y="6" width="1" height="1" class="w"/><rect x="6" y="6" width="1" height="1" class="w"/><rect x="8" y="6" width="1" height="1" class="w"/><rect x="10" y="6" width="3" height="1" class="w"/><rect x="2" y="10" width="1" height="1" class="c"/><rect x="4" y="10" width="1" height="1" class="c"/><rect x="6" y="10" width="1" height="1" class="c"/><rect x="8" y="10" width="1" height="1" class="c"/><rect x="10" y="10" width="1" height="1" class="c"/><rect x="12" y="10" width="1" height="1" class="c"/><rect x="14" y="10" width="1" height="1" class="c"/><rect x="16" y="10" width="6" height="1" class="c"/><rect x="11" y="11" width="1" height="1" class="c"/><rect x="13" y="11" width="1" height="1" class="c"/><rect x="15" y="11" width="1" height="1" class="c"/><rect x="17" y="11" width="5" height="1" class="c"/><rect x="2" y="12" width="1" height="1" class="c"/><rect x="4" y="12" width="1" height="1" class="c"/><rect x="6" y="12" width="1" height="1" class="c"/><rect x="8" y="12" width="1" height="1" class="c"/><rect x="10" y="12" width="1" height="1" class="c"/><rect x="12" y="12" width="1" height="1" class="c"/><rect x="14" y="12" width="1" height="1" class="c"/><rect x="16" y="12" width="6" height="1" class="c"/><rect x="11" y="13" width="1" height="1" class="c"/><rect x="13" y="13" width="1" height="1" class="c"/><rect x="15" y="13" width="1" height="1" class="c"/><rect x="17" y="13" width="5" height="1" class="c"/><rect x="9" y="17" width="1" height="1" class="w"/><rect x="11" y="17" width="1" height="1" class="w"/><rect x="13" y="17" width="4" height="1" class="w"/><rect x="2" y="18" width="1" height="1" class="w"/><rect x="4" y="18" width="1" height="1" class="w"/><rect x="6" y="18" width="1" height="1" class="w"/><rect x="8" y="18" width="1" height="1" class="w"/><rect x="10" y="18" width="1" height="1" class="w"/><rect x="12" y="18" width="1" height="1" class="w"/><rect x="14" y="18" width="3" height="1" class="w"/><rect x="9" y="19" width="1" height="1" class="w"/><rect x="11" y="19" width="1" height="1" class="w"/><rect x="13" y="19" width="4" height="1" class="w"/><rect x="2" y="20" width="1" height="1" class="w"/><rect x="4" y="20" width="1" height="1" class="w"/><rect x="6" y="20" width="1" height="1" class="w"/><rect x="8" y="20" width="1" height="1" class="w"/><rect x="10" y="20" width="1" height="1" class="w"/><rect x="12" y="20" width="1" height="1" class="w"/><rect x="14" y="20" width="3" height="1" class="w"/></svg> PreScale</div>
    <div class="url mono">prescale.dev</div>
  </div>

  <h1><span>Load-test your app</span><span class="dim">and find out why it breaks.</span></h1>

  <div class="chart" id="chart"></div>
  <div class="glow" id="glow"></div>
  <div class="wall" id="wall"></div>
  <div class="wall-label mono" id="wallLabel">2s latency wall</div>
  <div class="verdict mono"><span class="fg">survives ~100 users</span><span class="sep">·</span>breaks at <span class="red">/api/search</span><span class="sep">→</span><span class="fg">DB connection pool exhausted</span></div>

  <script>
    const CALM = ["#3FD3DE", "#A56EF7", "#F05BAA", "#4B8EF3", "#C9CBF2"];
    const sparse = (c, cell = 6) => `conic-gradient(${c} 25%, transparent 0) 0 0 / ${cell}px ${cell}px`;
    const checker = (c, cell = 6) => `conic-gradient(${c} 25%, transparent 0 50%, ${c} 0 75%, transparent 0) 0 0 / ${cell}px ${cell}px`;

    // The ramp. Latency rises with load; the last stage goes through the wall.
    const STAGES = [[10, 38], [25, 52], [50, 96], [75, 180], [100, 420], [150, 2100]];
    const chart = document.getElementById("chart");
    const width = 1200 - 64 * 2 - 92;      // track width
    const wallAt = 0.80;                  // the 2s wall sits at 80% of the track
    const toX = (ms) => ms >= 2000 ? width * 0.94 : width * wallAt * Math.max(0.09, Math.log(ms / 20) / Math.log(2000 / 20));
    STAGES.forEach(([users, ms], i) => {
      const last = i === STAGES.length - 1;
      const c = last ? "#EE4B44" : CALM[i % CALM.length];
      const x = toX(ms);
      const label = ms >= 1000 ? `${(ms / 1000).toFixed(1)} s` : `${ms} ms`;
      chart.insertAdjacentHTML("beforeend", `
        <div class="row">
          <div class="users mono">${users} users</div>
          <div class="track">
            <div class="bar" style="width:${x}px">
              <span class="s" style="background:${sparse(c)}"></span>
              <span class="c" style="background:${checker(c)}"></span>
              <span class="e" style="background:${c}"></span>
            </div>
            <div class="ms mono ${last ? "break" : ""}" style="left:${x + 12}px">${label}</div>
          </div>
        </div>`);
    });

    // Wall position in page coordinates.
    const wallX = 64 + 92 + width * wallAt;
    Object.assign(document.getElementById("wall").style, { left: `${wallX}px` });
    Object.assign(document.getElementById("wallLabel").style, { left: `${wallX}px` });
    const lastRowY = 312 + 5 * 39 + 9;
    Object.assign(document.getElementById("glow").style, { left: `${wallX - 150}px`, top: `${lastRowY - 100}px` });
  </script>
</body>
</html>
